<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Панель проекта</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#summary"><img class="avatar" src="assets/avatar.svg" alt="">Панель проекта</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation" aria-controls="mainNavigation" aria-expanded="false" aria-label="Открыть меню"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainNavigation">
        <ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="#summary">Сводка</a></li><li class="nav-item"><a class="nav-link" href="#activity">Действия</a></li></ul>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    <div id="loadError" class="alert alert-danger d-none" role="alert">Не удалось загрузить `data/dashboard.json`.</div>
    <section id="summary" class="mb-4" aria-labelledby="summaryTitle">
      <h1 id="summaryTitle" class="h3 mb-3">Сводка</h1>
      <div id="metrics" class="row row-cols-1 row-cols-sm-2 row-cols-xl-4 g-3"></div>
    </section>
    <section id="activity" aria-labelledby="activityTitle">
      <h2 id="activityTitle" class="h4 mb-3">Последние действия</h2>
      <div class="table-responsive bg-white border rounded">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light"><tr><th scope="col">ID</th><th scope="col">Действие</th><th scope="col">Статус</th></tr></thead>
          <tbody id="activityRows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="js/app.js"></script>
</body>
</html>
